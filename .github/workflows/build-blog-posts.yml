name: Build Blog Posts from CMS

on:
  push:
    paths:
      - 'blog/posts/*.md'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Build HTML posts from markdown
        run: |
          TEMPLATE=".github/templates/blog-post-template.html"

          if [ ! -f "$TEMPLATE" ]; then
            echo "Template not found!"
            exit 1
          fi

          for mdfile in blog/posts/*.md; do
            [ -f "$mdfile" ] || continue

            filename=$(basename "$mdfile" .md)

            # Skip if HTML already exists and md is not newer
            if [ -f "blog/$filename.html" ] && [ "blog/$filename.html" -nt "$mdfile" ]; then
              echo "Skipping $filename - HTML is up to date"
              continue
            fi

            echo "Building: $filename"

            # Parse frontmatter
            TITLE=$(sed -n '/^---$/,/^---$/{ /^title:/s/^title: *"\{0,1\}\(.*\)"\{0,1\}$/\1/p }' "$mdfile")
            SUBTITLE=$(sed -n '/^---$/,/^---$/{ /^subtitle:/s/^subtitle: *"\{0,1\}\(.*\)"\{0,1\}$/\1/p }' "$mdfile")
            DESCRIPTION=$(sed -n '/^---$/,/^---$/{ /^description:/s/^description: *"\{0,1\}\(.*\)"\{0,1\}$/\1/p }' "$mdfile")
            IMAGE=$(sed -n '/^---$/,/^---$/{ /^image:/s/^image: *"\{0,1\}\(.*\)"\{0,1\}$/\1/p }' "$mdfile")
            DATE=$(sed -n '/^---$/,/^---$/{ /^date:/s/^date: *"\{0,1\}\(.*\)"\{0,1\}$/\1/p }' "$mdfile")
            AUTHOR=$(sed -n '/^---$/,/^---$/{ /^author:/s/^author: *"\{0,1\}\(.*\)"\{0,1\}$/\1/p }' "$mdfile")
            READTIME=$(sed -n '/^---$/,/^---$/{ /^readtime:/s/^readtime: *"\{0,1\}\(.*\)"\{0,1\}$/\1/p }' "$mdfile")
            KEYWORDS=$(sed -n '/^---$/,/^---$/{ /^keywords:/s/^keywords: *"\{0,1\}\(.*\)"\{0,1\}$/\1/p }' "$mdfile")

            # Format date for display
            if [ -n "$DATE" ]; then
              DISPLAY_DATE=$(date -d "$DATE" '+%B %d, %Y' 2>/dev/null || echo "$DATE")
            else
              DISPLAY_DATE=$(date '+%B %d, %Y')
            fi

            # Extract body (everything after second ---)
            BODY=$(sed -n '/^---$/,/^---$/!p' "$mdfile" | tail -n +1)

            # Convert markdown to HTML using python
            BODY_HTML=$(python3 -c "
import re, sys, html

md = sys.stdin.read()

# Convert headers
md = re.sub(r'^### (.+)$', r'<h3>\1</h3>', md, flags=re.MULTILINE)
md = re.sub(r'^## (.+)$', r'<h2>\1</h2>', md, flags=re.MULTILINE)

# Convert bold and italic
md = re.sub(r'\*\*\*(.+?)\*\*\*', r'<strong><em>\1</em></strong>', md)
md = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', md)
md = re.sub(r'\*(.+?)\*', r'<em>\1</em>', md)

# Convert links
md = re.sub(r'\[([^\]]+)\]\(([^)]+)\)', r'<a href="\2" target="_blank" rel="noopener noreferrer">\1</a>', md)

# Convert images
md = re.sub(r'!\[([^\]]*)\]\(([^)]+)\)', r'<img src="\2" alt="\1" class="w-full rounded-2xl my-8">', md)

# Convert blockquotes
md = re.sub(r'^> (.+)$', r'<blockquote>\1</blockquote>', md, flags=re.MULTILINE)

# Convert unordered lists
lines = md.split('\n')
result = []
in_ul = False
in_ol = False
for line in lines:
    stripped = line.strip()
    if stripped.startswith('- ') or stripped.startswith('* '):
        if not in_ul:
            result.append('<ul>')
            in_ul = True
        result.append('<li>' + stripped[2:] + '</li>')
    elif re.match(r'^\d+\.\s', stripped):
        if not in_ol:
            result.append('<ol>')
            in_ol = True
        content = re.sub(r'^\d+\.\s', '', stripped)
        result.append('<li>' + content + '</li>')
    else:
        if in_ul:
            result.append('</ul>')
            in_ul = False
        if in_ol:
            result.append('</ol>')
            in_ol = False
        if stripped and not stripped.startswith('<'):
            result.append('<p>' + stripped + '</p>')
        else:
            result.append(line)
if in_ul:
    result.append('</ul>')
if in_ol:
    result.append('</ol>')

print('\n'.join(result))
" <<< "$BODY")

            # Build HTML from template
            sed -e "s|{{TITLE}}|$TITLE|g" \
                -e "s|{{SUBTITLE}}|${SUBTITLE:-Blog Post}|g" \
                -e "s|{{DESCRIPTION}}|$DESCRIPTION|g" \
                -e "s|{{IMAGE}}|$IMAGE|g" \
                -e "s|{{DATE}}|$DISPLAY_DATE|g" \
                -e "s|{{READTIME}}|${READTIME:-5 Min Read}|g" \
                -e "s|{{AUTHOR}}|${AUTHOR:-Khalid Hussain Mir (Khalidgraphy)}|g" \
                -e "s|{{KEYWORDS}}|$KEYWORDS|g" \
                -e "s|{{SLUG}}|$filename|g" \
                -e "/{{BODY}}/r /dev/stdin" \
                -e "/{{BODY}}/d" \
                "$TEMPLATE" <<< "$BODY_HTML" > "blog/$filename.html"

            echo "Created: blog/$filename.html"
          done

      - name: Update posts.json
        run: |
          echo "[" > /tmp/posts.json
          first=true
          for file in blog/*.html; do
            filename=$(basename "$file")
            if [ "$filename" = "index.html" ] || [ "$filename" = "blog.html" ]; then
              continue
            fi
            slug="${filename%.html}"
            title=$(grep -oP '(?<=<title>).*?(?= \|)' "$file" 2>/dev/null || echo "")
            description=$(grep -oP '(?<=<meta name="description" content=")[^"]*' "$file" 2>/dev/null || echo "")
            image=$(grep -oP '(?<=<meta property="og:image" content=")[^"]*' "$file" 2>/dev/null || echo "")

            if [ -z "$title" ]; then
              title=$(echo "$slug" | sed 's/-/ /g; s/\b\(.)/ \U\1/g')
            fi

            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> /tmp/posts.json
            fi

            title=$(echo "$title" | sed 's/"/\\"/g')
            description=$(echo "$description" | sed 's/"/\\"/g')

            cat >> /tmp/posts.json <<ENTRY
          {
            "slug": "$slug",
            "title": "$title",
            "description": "$description",
            "image": "$image"
          }
          ENTRY
          done
          echo "]" >> /tmp/posts.json
          cp /tmp/posts.json blog/posts.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-build blog posts from CMS content"
          git push
